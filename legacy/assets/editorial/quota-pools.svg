<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc"><title id="title">服务商额度池与模型的关系</title><desc id="desc">模型关联其共享额度池，任务可以独立发送到不同 Agent；图示不包含真实额度数字。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10" fill="none" stroke="#73867e" stroke-width="1.5"/></marker></defs><rect width="1100" height="500" fill="#e9eee7"/><g font-family="Arial, Microsoft YaHei, sans-serif"><text x="46" y="55" font-size="30" fill="#192622">SHARED QUOTA, CLEAR CHOICES</text><rect x="46" y="104" width="485" height="328" rx="12" fill="#192622"/><text x="75" y="151" font-size="26" fill="#d1ffca">额度来源</text><text x="75" y="208" font-size="21" fill="#f4f7f2">Codex / 账户窗口</text><text x="75" y="264" font-size="21" fill="#f4f7f2">Antigravity / 模型组</text><text x="75" y="320" font-size="21" fill="#f4f7f2">DeepSeek / API 余额</text><text x="75" y="376" font-size="21" fill="#f4f7f2">WorkBuddy / 网页积分</text><path d="M531 265 H575.5 V265 H620" fill="none" stroke="#73867e" stroke-width="2" marker-end="url(#arrow)"/><rect x="620" y="104" width="435" height="328" rx="12" fill="#fff"/><text x="650" y="151" font-size="26" fill="#192622">模型与任务</text><rect x="646" y="180" width="382" height="96" rx="12" fill="#e9eee7"/><text x="668" y="218" font-size="24" fill="#192622">模型目录</text><text x="668" y="249" font-size="18" fill="#53635b">按可用模型与倍率查看</text><rect x="646" y="299" width="382" height="96" rx="12" fill="#d1ffca"/><text x="668" y="337" font-size="24" fill="#192622">三路分工</text><text x="668" y="368" font-size="18" fill="#53635b">技术方案 / 替代方案 / 交付结构</text><text x="46" y="472" font-size="19" fill="#53635b">结构示意 / 不把共享余额拆成虚假的独立模型额度</text></g></svg>
