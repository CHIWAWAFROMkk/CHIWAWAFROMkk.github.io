<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc"><title id="title">校园 AI 任务研究结构</title><desc id="desc">按任务输入、执行、证据核验、反馈组成研究流程。图示不代表已完成实验数据。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10" fill="none" stroke="#73867e" stroke-width="1.5"/></marker></defs><rect width="1100" height="500" fill="#e9eee7"/><g font-family="Arial, Microsoft YaHei, sans-serif"><text x="46" y="55" font-size="30" fill="#192622">A QUESTION BECOMES A METHOD</text><rect x="46" y="106" width="300" height="96" rx="12" fill="#fff"/><text x="68" y="144" font-size="24" fill="#192622">任务输入</text><text x="68" y="175" font-size="18" fill="#53635b">具体场景与研究问题</text><rect x="46" y="302" width="300" height="96" rx="12" fill="#fff"/><text x="68" y="340" font-size="24" fill="#192622">核验依据</text><text x="68" y="371" font-size="18" fill="#53635b">来源、过程与可复算记录</text><rect x="421" y="106" width="330" height="292" rx="12" fill="#192622"/><text x="450" y="153" font-size="30" fill="#d1ffca">任务实验</text><text x="450" y="218" font-size="22" fill="#f4f7f2">信息是否有依据</text><text x="450" y="279" font-size="22" fill="#f4f7f2">过程能否被复做</text><text x="450" y="340" font-size="22" fill="#f4f7f2">结果是否可使用</text><path d="M346 154 H383.5 V154 H421" fill="none" stroke="#73867e" stroke-width="2" marker-end="url(#arrow)"/><path d="M346 350 H383.5 V350 H421" fill="none" stroke="#73867e" stroke-width="2" marker-end="url(#arrow)"/><path d="M751 252 H779 V252 H807" fill="none" stroke="#73867e" stroke-width="2" marker-end="url(#arrow)"/><rect x="807" y="203" width="249" height="96" rx="12" fill="#d1ffca"/><text x="829" y="241" font-size="24" fill="#192622">比较与反馈</text><text x="829" y="272" font-size="18" fill="#53635b">记录差异与边界</text><text x="46" y="462" font-size="19" fill="#53635b">方法结构示意 / 不展示未经采集的实验结果</text></g></svg>
