<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc"><title id="title">证据进入匹配与材料的路径</title><desc id="desc">已确认经历进入材料，待确认经历需要人工核验，提交前由本人审阅。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10" fill="none" stroke="#73867e" stroke-width="1.5"/></marker></defs><rect width="1100" height="500" fill="#e9eee7"/><g font-family="Arial, Microsoft YaHei, sans-serif"><text x="46" y="55" font-size="30" fill="#192622">EVIDENCE BEFORE OUTPUT</text><rect x="46" y="112" width="280" height="96" rx="12" fill="#fff"/><text x="68" y="150" font-size="24" fill="#192622">事实档案</text><text x="68" y="181" font-size="18" fill="#53635b">每条经历带来源与状态</text><rect x="46" y="294" width="280" height="96" rx="12" fill="#fff"/><text x="68" y="332" font-size="24" fill="#192622">职位要求</text><text x="68" y="363" font-size="18" fill="#53635b">技能与到岗条件</text><path d="M326 160 H366.5 V160 H407" fill="none" stroke="#73867e" stroke-width="2" marker-end="url(#arrow)"/><path d="M326 342 H366.5 V342 H407" fill="none" stroke="#73867e" stroke-width="2" marker-end="url(#arrow)"/><rect x="407" y="112" width="275" height="96" rx="12" fill="#d1ffca"/><text x="429" y="150" font-size="24" fill="#192622">已确认的证据</text><text x="429" y="181" font-size="18" fill="#53635b">进入匹配与材料</text><rect x="407" y="294" width="275" height="96" rx="12" fill="#ddd8ca"/><text x="429" y="332" font-size="24" fill="#192622">待确认的经历</text><text x="429" y="363" font-size="18" fill="#53635b">保留缺口与问题</text><path d="M682 160 H722.5 V160 H763" fill="none" stroke="#73867e" stroke-width="2" marker-end="url(#arrow)"/><path d="M682 342 H722.5 V342 H763" fill="none" stroke="#73867e" stroke-width="2" marker-end="url(#arrow)"/><rect x="763" y="112" width="290" height="96" rx="12" fill="#fff"/><text x="785" y="150" font-size="24" fill="#192622">材料草稿</text><text x="785" y="181" font-size="18" fill="#53635b">只使用有依据的信息</text><rect x="763" y="294" width="290" height="96" rx="12" fill="#fff"/><text x="785" y="332" font-size="24" fill="#192622">本人审阅</text><text x="785" y="363" font-size="18" fill="#53635b">核对条件与最终内容</text><path d="M908 208 H908 V294 H908" fill="none" stroke="#73867e" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
