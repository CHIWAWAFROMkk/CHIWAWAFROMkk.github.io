<!doctype html>
<html lang="zh-CN" data-mode="loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>下潜：荣格与我</title>
<meta name="description" content="一张向心理深处下潜的互动星图：人格面具、凝视、投射、情结、阴影、阿尼玛与自性。">
<link rel="icon" href="data:,">
<style>
  :root { --bg:#05070f; --ink:#c9ccd6; --dim:#7d8296; --red:#b5372c; --blue:#1a3a8c; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",SimSun,serif; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  /* 静态阅读版（data-mode="none"）与加载中 */
  #stage, #nav, #labels, #emos, #mini, #ctrl, #hint { display:none; }
  #err[hidden], #loading[hidden] { display:none; }
  #err, #loading { margin:0; padding:1rem 1.25rem; text-align:center; color:var(--dim); font-size:.85rem; }
  html[data-mode="loading"] #story, html[data-mode="loading"] #note { display:none; }
  #note { margin:0; padding:1.25rem; text-align:center; font-size:.75rem; color:var(--dim); }
  #story { position:relative; z-index:2; }
  .station { max-width:42rem; padding:3rem 1.25rem; margin:0 auto; }
  .station img { width:100%; height:auto; display:block; margin:0 0 1.5rem; }
  .kind { font-size:.75rem; letter-spacing:.18em; color:var(--dim); margin:0 0 .5rem; }
  h2 { font-weight:400; font-size:clamp(1.6rem,4vw,2.4rem); margin:0; letter-spacing:.08em; }
  .en { color:var(--dim); font-style:italic; margin:.15rem 0 1rem; }
  .concept, .take, .try { line-height:1.85; margin:.5rem 0; }
  .take::before { content:"我的理解　"; color:var(--red); font-size:.8rem; letter-spacing:.1em; }
  .try { color:var(--dim); }
  .src { font-size:.75rem; color:var(--dim); margin-top:.75rem; }

  /* 星图（high / low） */
  html[data-mode="high"], html[data-mode="low"], html[data-mode="high"] body, html[data-mode="low"] body { overflow:hidden; height:100%; }
  html[data-mode="high"] #stage, html[data-mode="low"] #stage { display:block; position:fixed; inset:0; width:100%; height:100%; touch-action:none; cursor:grab; }
  html[data-mode="high"] #note, html[data-mode="low"] #note { position:fixed; z-index:3; right:1rem; top:1rem; max-width:16rem; padding:0; text-align:right; font-size:.7rem; }
  html[data-mode="high"] .station, html[data-mode="low"] .station {
    position:fixed; left:clamp(1rem,5vw,4rem); bottom:clamp(1rem,8vh,4rem); width:min(30rem,calc(100vw - 2rem)); margin:0; padding:0;
    max-height:calc(100vh - 2 * clamp(1rem,8vh,4rem)); overflow:auto; opacity:0; pointer-events:none; text-shadow:0 1px 12px #05070f; }
  html[data-mode="high"] .station img, html[data-mode="low"] .station img { display:none; }
  html[data-mode="high"] #nav, html[data-mode="low"] #nav { display:flex; position:fixed; z-index:4; left:1rem; top:1rem; flex-direction:column; gap:.25rem; }
  #nav button { all:unset; cursor:pointer; font-size:.78rem; letter-spacing:.08em; color:var(--dim); padding:.2rem .5rem; border-left:2px solid #2a2f45; }
  #nav button:hover, #nav button:focus-visible { color:var(--ink); }
  #nav button[aria-current="true"] { color:var(--ink); border-left-color:var(--red); }
  html[data-mode="high"] #labels, html[data-mode="low"] #labels, html[data-mode="high"] #emos, html[data-mode="low"] #emos { display:block; position:fixed; inset:0; z-index:3; pointer-events:none; }
  .lbl { position:absolute; transform:translate(-50%,0); font-size:.78rem; letter-spacing:.14em; color:var(--ink); text-shadow:0 1px 8px #05070f; white-space:nowrap; transition:opacity .4s; }
  .lbl small { display:block; text-align:center; color:var(--dim); font-size:.62rem; letter-spacing:.2em; }
  .emo { position:absolute; transform:translate(10px,-50%); font-size:.8rem; color:#d6c3c0; text-shadow:0 1px 8px #05070f; white-space:nowrap; }
  .emo::before { content:""; position:absolute; left:-12px; top:50%; width:5px; height:5px; margin-top:-2.5px; border-radius:50%; background:var(--red); box-shadow:0 0 8px var(--red); }
  html[data-mode="high"] #mini, html[data-mode="low"] #mini { display:block; position:fixed; z-index:4; right:1rem; bottom:2.2rem; width:150px; height:150px; border:1px solid #1d2238; background:#070a14cc; cursor:pointer; }
  html[data-mode="high"] #ctrl, html[data-mode="low"] #ctrl { display:flex; position:fixed; z-index:4; right:1rem; bottom:calc(2.2rem + 160px); gap:.4rem; opacity:0; pointer-events:none; transition:opacity .4s; }
  html[data-mode="high"] #ctrl.on, html[data-mode="low"] #ctrl.on { opacity:1; pointer-events:auto; }
  #ctrl button { cursor:pointer; background:#0b1020cc; color:var(--ink); border:1px solid #2a2f45; padding:.35rem .7rem; font:inherit; font-size:.78rem; }
  #ctrl button:hover, #ctrl button:focus-visible { border-color:var(--red); }
  html[data-mode="high"] #hint, html[data-mode="low"] #hint { display:block; position:fixed; z-index:4; left:50%; bottom:1rem; transform:translateX(-50%); font-size:.75rem; letter-spacing:.18em; color:var(--dim); margin:0; transition:opacity .4s; white-space:nowrap; }
  #hint.off { opacity:0; }

  /* 窄屏：站点列表改为顶部横向条，小地图在左上，按钮在其下，声明放到底部 */
  @media (max-width: 700px) {
    html[data-mode="high"] #nav, html[data-mode="low"] #nav { top:.75rem; left:7rem; right:.75rem; flex-direction:row; gap:0; overflow-x:auto; }
    #nav button { white-space:nowrap; border-left:none; border-bottom:2px solid #2a2f45; padding:.35rem .5rem; }
    #nav button[aria-current="true"] { border-bottom-color:var(--red); }
    html[data-mode="high"] #mini, html[data-mode="low"] #mini { top:.75rem; left:.75rem; bottom:auto; right:auto; width:96px; height:96px; }
    html[data-mode="high"] #ctrl, html[data-mode="low"] #ctrl { top:3.3rem; left:7rem; right:.75rem; bottom:auto; flex-direction:row; justify-content:flex-end; }
    html[data-mode="high"] #note, html[data-mode="low"] #note { top:auto; bottom:.35rem; left:0; right:0; max-width:none; text-align:center; font-size:.62rem; }
    html[data-mode="high"] .station, html[data-mode="low"] .station { bottom:1.6rem; }
    html[data-mode="high"] #hint, html[data-mode="low"] #hint { bottom:1.6rem; }
  }
</style>
</head>
<body>
<h1 class="sr">下潜：荣格与我</h1>
<noscript><p style="padding:1.25rem;color:#7d8296">这个页面需要 JavaScript 才能显示内容。</p></noscript>
<canvas id="stage" aria-hidden="true"></canvas>
<p id="loading">正在铺开星图……</p>
<p id="err" hidden>三维视图暂时无法加载，已切换为静态阅读版。</p>
<p id="note">个人叙事与可视化，不是心理测评，不输出分数或类型结论。</p>
<nav id="nav" aria-label="七站列表"></nav>
<main id="story"></main>
<div id="labels" aria-hidden="true"></div>
<div id="emos" aria-hidden="true"></div>
<canvas id="mini" width="150" height="150" aria-label="小地图"></canvas>
<div id="ctrl" role="group" aria-label="站内导航">
  <button id="btn-prev" type="button">‹ 上一站</button>
  <button id="btn-over" type="button">返回全图</button>
  <button id="btn-next" type="button">下一站 ›</button>
</div>
<p id="hint">拖动旋转　·　滚轮缩放　·　点一站飞进去</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
