<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc"><title id="title">员工电子档案审核流程</title><desc id="desc">以员工主名单查找文件，生成候选字段，人工审核后写入目标主表，并保留异常。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10" fill="none" stroke="#73867e" stroke-width="1.5"/></marker></defs><rect width="1100" height="500" fill="#e9eee7"/><g font-family="Arial, Microsoft YaHei, sans-serif"><text x="46" y="55" font-size="30" fill="#192622">A RECORD NEEDS A TRAIL</text><rect x="46" y="110" width="240" height="96" rx="12" fill="#fff"/><text x="68" y="148" font-size="24" fill="#192622">员工主名单</text><text x="68" y="179" font-size="18" fill="#53635b">确定处理对象</text><rect x="46" y="308" width="240" height="96" rx="12" fill="#fff"/><text x="68" y="346" font-size="24" fill="#192622">档案文件</text><text x="68" y="377" font-size="18" fill="#53635b">按身份线索查找</text><path d="M286 158 H330.5 V158 H375" fill="none" stroke="#73867e" stroke-width="2" marker-end="url(#arrow)"/><path d="M286 356 H330.5 V356 H375" fill="none" stroke="#73867e" stroke-width="2" marker-end="url(#arrow)"/><rect x="375" y="110" width="270" height="96" rx="12" fill="#fff"/><text x="397" y="148" font-size="24" fill="#192622">候选字段</text><text x="397" y="179" font-size="18" fill="#53635b">提取信息并保留来源</text><rect x="375" y="308" width="270" height="96" rx="12" fill="#ddd8ca"/><text x="397" y="346" font-size="24" fill="#192622">待核验与异常</text><text x="397" y="377" font-size="18" fill="#53635b">缺失、冲突、匹配不清</text><path d="M645 158 H700 V158 H755" fill="none" stroke="#73867e" stroke-width="2" marker-end="url(#arrow)"/><path d="M510 206 H510 V308 H510" fill="none" stroke="#73867e" stroke-width="2" marker-end="url(#arrow)"/><rect x="755" y="110" width="300" height="96" rx="12" fill="#d1ffca"/><text x="777" y="148" font-size="24" fill="#192622">人工审核</text><text x="777" y="179" font-size="18" fill="#53635b">检查身份与字段依据</text><path d="M905 206 H905 V308 H905" fill="none" stroke="#73867e" stroke-width="2" marker-end="url(#arrow)"/><rect x="755" y="308" width="300" height="96" rx="12" fill="#fff"/><text x="777" y="346" font-size="24" fill="#192622">补录主表</text><text x="777" y="377" font-size="18" fill="#53635b">保留处理与审核记录</text></g></svg>
