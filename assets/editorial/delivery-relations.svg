<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc"><title id="title">订单连接业务实体</title><desc id="desc">学生、商家、菜品、订单、支付、配送和退款围绕订单形成关系。为简化关系示意，非完整数据库定义。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10" fill="none" stroke="#73867e" stroke-width="1.5"/></marker></defs><rect width="1100" height="500" fill="#e9eee7"/><g font-family="Arial, Microsoft YaHei, sans-serif"><text x="46" y="55" font-size="30" fill="#192622">ONE ORDER, CONNECTED RECORDS</text><rect x="46" y="110" width="240" height="96" rx="12" fill="#fff"/><text x="68" y="148" font-size="24" fill="#192622">学生</text><text x="68" y="179" font-size="18" fill="#53635b">下单人与送达地址</text><rect x="46" y="310" width="240" height="96" rx="12" fill="#fff"/><text x="68" y="348" font-size="24" fill="#192622">商家与菜品</text><text x="68" y="379" font-size="18" fill="#53635b">菜单、数量与库存</text><path d="M286 158 H347.5 V245 H409" fill="none" stroke="#73867e" stroke-width="2" marker-end="url(#arrow)"/><path d="M286 358 H347.5 V245 H409" fill="none" stroke="#73867e" stroke-width="2" marker-end="url(#arrow)"/><rect x="409" y="163" width="276" height="165" rx="12" fill="#192622"/><text x="438" y="210" font-size="29" fill="#d1ffca">订单 / 明细</text><text x="438" y="256" font-size="21" fill="#fff">金额 · 状态 · 数量</text><text x="438" y="299" font-size="18" fill="#cad8d1">一致的事务边界</text><path d="M685 245 H748 V127 H811" fill="none" stroke="#73867e" stroke-width="2" marker-end="url(#arrow)"/><path d="M685 245 H748 V262 H811" fill="none" stroke="#73867e" stroke-width="2" marker-end="url(#arrow)"/><path d="M685 245 H748 V397 H811" fill="none" stroke="#73867e" stroke-width="2" marker-end="url(#arrow)"/><rect x="811" y="79" width="243" height="96" rx="12" fill="#fff"/><text x="833" y="117" font-size="24" fill="#192622">支付</text><text x="833" y="148" font-size="18" fill="#53635b">金额记录</text><rect x="811" y="214" width="243" height="96" rx="12" fill="#d1ffca"/><text x="833" y="252" font-size="24" fill="#192622">配送</text><text x="833" y="283" font-size="18" fill="#53635b">履约状态</text><rect x="811" y="349" width="243" height="96" rx="12" fill="#fff"/><text x="833" y="387" font-size="24" fill="#192622">退款</text><text x="833" y="418" font-size="18" fill="#53635b">反向冲销</text></g></svg>
